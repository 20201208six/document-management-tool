appId: com.copywriting.assistant
productName: 文案助手
directories:
  output: release
  buildResources: resources
win:
  target:
    - target: portable
      arch: [x64]
  icon: resources/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  language: 2052
files:
  - dist/**/*
  - dist-electron/**/*
extraResources:
  - resources/**
